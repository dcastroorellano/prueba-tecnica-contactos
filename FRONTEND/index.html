<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Contactos</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold">Gestión de Contactos</h1>
        <p class="text-muted">Registro y administración de contactos</p>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h4 mb-4">Registrar contacto</h2>

          <form id="contactoForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="tipoIdentificacion" class="form-label">
                  Tipo de identificación
                </label>

                <select id="tipoIdentificacion" class="form-select" required>
                  <option value="">Seleccione...</option>
                  <option value="CC">CC</option>
                  <option value="TI">TI</option>
                  <option value="NIT">NIT</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="identificacion" class="form-label">
                  Identificación
                </label>

                <input
                  type="text"
                  id="identificacion"
                  class="form-control"
                  maxlength="20"
                  required
                />
              </div>

              <div class="col-md-4">
                <label for="telefono" class="form-label"> Teléfono </label>

                <input
                  type="number"
                  id="telefono"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="nombres" class="form-label"> Nombres </label>

                <input
                  type="text"
                  id="nombres"
                  class="form-control"
                  maxlength="50"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="apellido" class="form-label"> Apellido </label>

                <input
                  type="text"
                  id="apellido"
                  class="form-control"
                  maxlength="50"
                  required
                />
              </div>

              <div class="col-12">
                <label for="direccion" class="form-label"> Dirección </label>

                <input
                  type="text"
                  id="direccion"
                  class="form-control"
                  maxlength="120"
                  required
                />
              </div>

              <div class="col-md-8">
                <label for="correoElectronico" class="form-label">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  id="correoElectronico"
                  class="form-control"
                  maxlength="120"
                  required
                />
              </div>

              <div class="col-md-4 d-flex align-items-end">
                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="cliente"
                  />

                  <label class="form-check-label" for="cliente">
                    Es cliente
                  </label>
                </div>
              </div>
            </div>

            <div class="mt-4">
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="btnGuardar">
                  Registrar contacto
                </button>

                <button
                  type="button"
                  class="btn btn-secondary d-none"
                  id="btnCancelar"
                >
                  Cancelar
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">Contactos registrados</h2>

            <button id="btnActualizar" class="btn btn-outline-secondary">
              Actualizar
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Tipo</th>
                  <th>Identificación</th>
                  <th>Nombre</th>
                  <th>Apellido</th>
                  <th>Teléfono</th>
                  <th>Dirección</th>
                  <th>Correo</th>
                  <th>Cliente</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody id="tablaContactos">
                <tr>
                  <td colspan="10" class="text-center text-muted">
                    No hay contactos registrados
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
